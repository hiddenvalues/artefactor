# A dependency with a build script must be named here, or a fresh install
# fails. `@appsignal/nodejs` (its native agent) and `protobufjs` (a version
# check, not needed) come from the cloud's `ee/` package; in an install without
# it, their entries name nothing and do nothing.
allowBuilds:
  '@appsignal/nodejs': true
  better-sqlite3: true
  esbuild: true
  protobufjs: false
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
# Security floors for transitive dependencies. /sync-oss regenerates OSS's
# lockfile with `pnpm install --lockfile-only`, which keeps every locked
# transitive version, so a lockfile-only security bump never reaches OSS. Each
# entry lifts only the vulnerable range and does nothing once none is left.
overrides:
  'zod@<4.6.6': ^4.6.7
